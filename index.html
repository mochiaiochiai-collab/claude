<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Fortune Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Angkor&family=Rubik+Bubbles&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="list">

  <!-- ============ iPad（1366×1024 の固定ステージを画面に合わせて拡大縮小） ============ -->
  <div class="stage ipad-only" id="stage">

    <header class="hd">
      <div class="hd-list">
        <h1 class="hd-title">Fortune Room</h1>
        <p class="hd-note">これはAIでつくったエンタメです。当たるも八卦当たらぬも八卦！</p>
        <p class="hd-sub">家族まとめて、四柱推命・九星気学・西洋占星術で見てみよう</p>
      </div>
      <div class="hd-done">
        <h1 class="hd-title">Your fortune is ready !</h1>
        <p class="hd-sub">QRを読み込んで結果をダウンロードしよう</p>
      </div>
      <img class="deco hd-bat" src="assets/q-mon-bat.svg" alt="" width="166" height="106">
    </header>

    <img class="deco mon-tr" src="assets/mon-tr.svg" alt="" width="98" height="226">

    <section class="panel" id="panel">
      <!-- 入力画面（①②③）のキャラクター -->
      <div class="decor decor-input" aria-hidden="true">
        <img class="deco mon-tl" src="assets/mon-tl.svg" alt="" width="200" height="185">
        <img class="deco mon-bl" src="assets/mon-bl.svg" alt="" width="103" height="146">
        <div class="deco mon-br">
          <img src="assets/mon-br-1.svg" alt="" width="147" height="122">
          <img class="p2" src="assets/mon-br-2.svg" alt="" width="13" height="13">
          <img class="p3" src="assets/mon-br-3.svg" alt="" width="12" height="10">
          <img class="p4" src="assets/mon-br-4.svg" alt="" width="13" height="9">
          <img class="p5" src="assets/mon-br-5.svg" alt="" width="3" height="4">
        </div>
      </div>
      <!-- 結果画面（④）のキャラクター -->
      <div class="decor decor-result" aria-hidden="true">
        <img class="deco q-bl" src="assets/q-mon-bl.svg" alt="" width="203" height="112">
        <img class="deco q-br" src="assets/q-mon-br.svg" alt="" width="128" height="109">
        <div class="deco q-tl"><img src="assets/q-mon-tl.svg" alt="" width="207" height="208"></div>
      </div>

      <!-- ① 家族の一覧 -->
      <div class="view" id="v-list">
        <p class="v-text">名前はニックネームでOK。生年月をいれてね！</p>
        <div class="list-scroll"><div class="list" id="k-people"></div></div>
        <p class="msg" id="k-msg" role="alert"></p>
      </div>

      <!-- ② ニックネーム -->
      <div class="view" id="v-name" hidden>
        <p class="v-text">名前はニックネームでOK！</p>
        <div class="field" id="n-disp" aria-live="polite"></div>
        <div class="pad pad-kana">
          <div class="kana" id="n-keys"></div>
          <div class="pad-row">
            <button type="button" class="pad-back" id="n-back">Back</button>
            <button type="button" class="pad-ok" id="n-ok">OK！</button>
          </div>
        </div>
      </div>

      <!-- ③ 生年月日 -->
      <div class="view" id="v-birth" hidden>
        <p class="v-text">誕生日は８桁の数字でOK→19980506</p>
        <div class="field field-num" id="b-disp" aria-live="polite"></div>
        <div class="pad pad-num">
          <div class="nums" id="b-keys"></div>
          <p class="msg msg-pad" id="b-msg" role="alert"></p>
          <div class="pad-row">
            <button type="button" class="pad-back" id="b-back">Back</button>
            <button type="button" class="pad-ok" id="b-ok">OK！</button>
          </div>
        </div>
      </div>

      <!-- ④ 結果案内（QR） -->
      <div class="view" id="v-result" hidden>
        <div class="sum">
          <p class="sum-lead">ひとことで言うと・・・</p>
          <p class="sum-title" id="k-sum-title"></p>
          <p class="sum-text" id="k-sum-text"></p>
          <div class="sum-list" id="k-sum-list"></div>
        </div>
        <div class="qr-wrap">
          <div class="qr" id="k-qr-img" aria-label="結果のQRコード"></div>
          <p class="msg msg-qr" id="k-qr-msg" role="status"></p>
        </div>
      </div>
    </section>

    <!-- 緑の雲ボタン（中身は family.js で組み立てる） -->
    <button type="button" class="cloud cloud-go" id="k-go" data-text="Let's<br>Fortune !" aria-label="Let's Fortune !"></button>
    <button type="button" class="cloud cloud-close" id="k-close" data-text="Close" aria-label="Close"></button>
  </div>

  <!-- ============ ケータイ ============ -->
  <main class="phone phone-only" id="phone">
    <section class="p-screen" id="p-dl">
      <div class="p-head">
        <h1 class="p-title">Fortune<br>Room</h1>
        <p class="p-lead">結果はダウンロードされます</p>
      </div>
      <div class="p-card" id="k-dl-names"></div>
      <img class="deco p-robot" src="assets/p-mon-robot.svg" alt="" width="81" height="64">
      <img class="deco p-crab" src="assets/p-mon-crab.svg" alt="" width="164" height="101">
      <img class="deco p-dino" src="assets/p-mon-dino.svg" alt="" width="164" height="199">
      <button type="button" class="cloud cloud-dl" id="k-dl" data-text="Download" data-arrow="1" aria-label="結果をダウンロード"></button>
    </section>

    <section class="p-screen p-saved" id="p-saved" hidden>
      <img class="saved-cloud" src="assets/saved-cloud.svg" alt="" width="347" height="291">
      <p class="saved-text">Saved !</p>
      <img class="saved-check" src="assets/check.svg" alt="" width="52" height="52">
      <p class="saved-bye">See you !</p>
      <img class="deco s-bl" src="assets/s-mon-bl.svg" alt="" width="203" height="110">
      <div class="deco s-bat s-bat1"><img src="assets/s-bat-1.svg" alt="" width="130" height="105"></div>
      <div class="deco s-bat s-bat2"><img src="assets/s-bat-2.svg" alt="" width="34" height="30"></div>
      <div class="deco s-bat s-bat3"><img src="assets/s-bat-3.svg" alt="" width="30" height="39"></div>
    </section>
  </main>

  <script src="family.js"></script>
</body>
</html>
